name: Build Husk 简体中文 IPA

on:
  workflow_dispatch:
    inputs:
      dependencies_only:
        description: 仅准备编译依赖（不生成 IPA）
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: husk-zh-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 350
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HUSK_DEPENDENCIES_ONLY: ${{ inputs.dependencies_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install build tools
        run: |
          brew install meson ninja pkg-config xcodegen qemu autoconf automake libtool cmake bison flex e2fsprogs
          rustup target add aarch64-apple-ios
          xcodebuild -version
      - name: Restore dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            build
            third_party/build
            third_party/sources
            third_party/gpu
            guests
            src/rppairing-ios/target
          key: husk-macos15-deps-v1-${{ github.run_id }}
          restore-keys: husk-macos15-deps-v1-
      - name: Check Swift syntax
        if: ${{ !inputs.dependencies_only }}
        run: |
          python3 scripts/check_localization.py
          find src/app -name '*.swift' -print0 | xargs -0 xcrun swiftc -frontend -parse
      - uses: actions/setup-java@v4
        if: ${{ !inputs.dependencies_only }}
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Android Java and Flutter resources
        if: ${{ !inputs.dependencies_only }}
        run: python3 scripts/prepare_android_resources.py
      - name: Build
        run: |
          mkdir -p build
          ./scripts/ci_build.sh "$PWD/build/Husk-2.0.0-zh-Hans.ipa" 2>&1 | tee build/ci.log
      - name: Verify IPA contents
        if: success() && !inputs.dependencies_only
        run: python3 scripts/verify_zh_ipa.py build/Husk-2.0.0-zh-Hans.ipa build/Husk-2.0.0-zh-Hans.tipa
      - name: Save dependencies
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            build
            third_party/build
            third_party/sources
            third_party/gpu
            guests
            src/rppairing-ios/target
          key: husk-macos15-deps-v1-${{ github.run_id }}
      - name: Upload IPA
        if: success() && !inputs.dependencies_only
        uses: actions/upload-artifact@v4
        with:
          name: Husk-2.0.0-zh-Hans
          path: |
            build/Husk-2.0.0-zh-Hans.ipa
            build/Husk-2.0.0-zh-Hans.tipa
            build/Husk-2.0.0-zh-Hans.*.verification.json
          if-no-files-found: error
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}
          path: |
            build/ci.log
            build/logs
            /tmp/husk_ipa/build.log
