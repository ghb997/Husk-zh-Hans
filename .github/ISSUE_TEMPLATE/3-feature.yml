name: Feature request
description: Something Husk could do that it doesn't.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like Husk to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why? What would it let you do?
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send it
      options:
        - label: I searched the existing issues and this is not already requested.
          required: true
